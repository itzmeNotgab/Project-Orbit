name: Release APK
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Tests
        run: gradle --no-daemon :core:test :network:test :library:test
      - name: Decode keystore (only if the secret exists)
        env: { KS_B64: "${{ secrets.ORBIT_KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/orbit.jks"; echo "ORBIT_KEYSTORE=$RUNNER_TEMP/orbit.jks" >> "$GITHUB_ENV"; fi
      - name: Build release APK
        env:
          ORBIT_KS_PASS: ${{ secrets.ORBIT_KS_PASS }}
          ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
          ORBIT_KEY_PASS: ${{ secrets.ORBIT_KEY_PASS }}
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with: { name: orbit-release-apk, path: app/build/outputs/apk/release/*.apk }
