name: Build ORBIT APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npx expo install --fix -- --legacy-peer-deps

      - name: Type check (reported, does not block the APK)
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK (arm64)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-apk
          path: android/app/build/outputs/apk/release/*.apk
